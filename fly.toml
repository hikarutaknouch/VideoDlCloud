# fly.toml app configuration file (改良版)
app = 'videodlcloud'
primary_region = 'nrt'

# Botを継続実行するための設定
[processes]
  app = "python discord_video_dl.py"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']

[build]
  dockerfile = "Dockerfile"

# 自動停止を無効化（Botは24/7稼働が必要）
[experimental]
  auto_stop_machines = false
  auto_start_machines = true

# ヘルスチェックはDockerfileのHEALTHCHECKを使用

# 環境変数（secretsで設定するもの以外）
[env]
  PYTHONUNBUFFERED = "1"
  TZ = "Asia/Tokyo"